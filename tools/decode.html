<!doctype html>
<meta charset="utf-8">
<title>Descomprimir modelos</title>
<pre id="log">Descomprimiendo modelos de NASA (Draco) para que el sitio no necesite el decodificador...</pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
<script>
var log = document.getElementById('log');
function L(s) { log.textContent += '\n' + s; }
var NAMES = ['apollo_lm', 'dawn', 'kepler', 'mer', 'near', 'pioneer10', 'viking1', 'insight', 'ingenuity'];
var q = (location.search.match(/[?&]names=([a-z0-9_,]+)/) || [])[1];
if (q) NAMES = q.split(',');
var draco = new THREE.DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');
var loader = new THREE.GLTFLoader();
loader.setDRACOLoader(draco);
var exporter = new THREE.GLTFExporter();
window.done = [];
function next(i) {
  if (i >= NAMES.length) { L('LISTO'); window.finished = true; return; }
  var n = NAMES[i];
  loader.load('../assets/models/' + n + '.glb', function (g) {
    exporter.parse(g.scene, function (buf) {
      fetch('/save/' + n + '.glb', { method: 'POST', body: buf }).then(function (r) {
        L(n + ': ' + Math.round(buf.byteLength / 1024) + ' KB ' + r.status); window.done.push(n); next(i + 1);
      });
    }, { binary: true, maxTextureSize: +((location.search.match(/[?&]tex=(\d+)/) || [])[1] || 1024) });
  }, undefined, function (e) { L(n + ': FALLA ' + e); next(i + 1); });
}
next(0);
</script>
